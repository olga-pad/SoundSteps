<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="SoundSteps — первые шаги в чтении по-русски."><title>SoundSteps</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:#173b35;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:700px;margin:auto;padding:18px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}header{display:flex;align-items:center;justify-content:space-between;min-height:48px}.brand{font-weight:750}.quiet{background:transparent;color:#55746d}button,select,input{font:inherit}button{border:0;cursor:pointer;border-radius:16px;padding:13px 16px;min-height:50px;font-weight:700;touch-action:manipulation}.reading{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;justify-content:center;text-align:center}.stage{min-height:48dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}.word{font-size:clamp(70px,20vw,116px);font-weight:750;letter-spacing:.035em;line-height:1.2}.word.hand{font-family:ReadingHand,cursive;font-weight:400;letter-spacing:0}.vowel{color:#c62828}.consonant{color:#1565c0}.sign{color:#55746d}.picture{font-size:78px;line-height:1.2;margin-top:26px;background:transparent;padding:0}.actions{display:grid;gap:10px;width:min(100%,470px);margin:0 auto}.primary{background:#277c6b;color:white}.help{background:#fff0df;color:#8d431e}.picture-btn{background:#edf5f1;color:#315f55}.reward{font-size:14px;color:#617c75;min-height:22px;margin-top:10px}[hidden]{display:none!important}@font-face{font-family:ReadingHand;src:url('./fonts/MarckScript-Regular.ttf') format('truetype');font-display:swap}.panel{background:white;border-radius:22px;padding:18px;margin:18px 0}.intro{color:#617c75;line-height:1.45}.letter-style{display:grid;gap:8px}.letter-style select,input{min-height:48px;border:1px solid #cadbd3;border-radius:13px;background:white;padding:10px}.word-list{display:grid;gap:8px}.word-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f5f9f6;border-radius:13px;padding:10px 12px}.word-row span{display:flex;gap:6px;flex-wrap:wrap}.word-row button{font-size:13px;min-height:38px;padding:7px 9px}.rating{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rating button{background:#edf5f1}.status{font-size:13px;background:#edf5f1;border-radius:999px;padding:5px 8px}@media(max-width:430px){main{padding-top:10px}.reading{min-height:calc(100dvh - 70px)}.stage{min-height:49dvh}.picture{font-size:70px}.rating{grid-template-columns:1fr}.word-row{align-items:flex-start;flex-direction:column}}
</style></head><body>
<main id="childView"><header><div class="brand">SoundSteps</div><button id="parentOpen" class="quiet">Для родителей</button></header><section class="reading"><div class="stage"><div id="word" class="word"></div><button id="pic" class="picture" hidden aria-label="Произнести слово"></button><div id="reward" class="reward"></div></div><div class="actions"><button id="help" class="help">🔊 Помоги прочитать</button><button id="showPicture" class="picture-btn">Показать картинку</button><button id="next" class="primary">Следующее слово</button></div></section></main>
<section id="parentView" hidden><main><header><button id="parentBack" class="quiet">← К чтению</button><div class="brand">Для родителей</div></header><section class="panel"><h2>Написание слов</h2><div class="letter-style"><label for="letterStyle">Режим</label><select id="letterStyle"><option value="normal">Обычные: кот</option><option value="upper">Заглавные: КОТ</option><option value="hand">Прописные: кот</option></select></div></section><section class="panel"><h2>Последнее слово</h2><div id="lastWord" style="font-size:40px;font-weight:750;margin:12px 0">—</div><div class="rating"><button data-result="self">Сам</button><button data-result="help">С помощью</button><button data-result="no">Не прочитал</button></div></section><section class="panel"><h2>Активные слова</h2><p class="intro">Пять слов остаются в работе. Когда освоены четыре, одно освоенное заменяется новым, а трудное остаётся.</p><div id="queue" class="word-list"></div></section><section class="panel"><h2>Уровень</h2><select id="level"><option value="3">3 буквы</option><option value="4">4 буквы</option><option value="5">5 букв</option></select></section><section class="panel"><h2>Добавить слово</h2><div style="display:flex;gap:8px"><input id="customWord" maxlength="12" placeholder="Например, волк" style="flex:1;min-width:0"><button id="addWord" class="primary">Добавить</button></div></section></main></section><script src="./app.js?v=16"></script></body></html>
