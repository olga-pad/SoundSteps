<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="SoundSteps — приложение для первых шагов в чтении по-русски, по-английски и по-французски."><title>SoundSteps</title><link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}body{margin:0;background:#eef6f1;color:#173b35;font:17px Arial}main{max-width:700px;margin:auto;padding:26px 24px 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;font-weight:bold}.shelf{background:#fff;padding:11px 15px;border-radius:16px;font-size:14px}.shelf span{color:#277c6b}h1{font-size:32px;margin:32px 0 10px}.intro{color:#52736b;line-height:1.5;margin:0 0 22px}.levels{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.levels>span{margin-right:5px;font-size:15px}button{font:700 16px Arial;cursor:pointer;border:0;border-radius:15px;padding:14px 18px;min-height:48px;background:#e8f1ec;color:#173b35}button:hover{filter:brightness(.96)}button:focus-visible{outline:3px solid #b85e27;outline-offset:4px}button:disabled{opacity:.5;cursor:default}.level{background:#dcebe3;min-width:46px;padding:12px}.level[aria-pressed=true],.primary{background:#277c6b;color:#fff}.progress-head{display:flex;justify-content:space-between;margin:26px 0 9px;font-size:14px}.progress{display:flex;gap:8px}.step{height:7px;background:#d3e5dc;flex:1;border-radius:10px}.step.done{background:#277c6b}.card{background:#fff;border-radius:28px;padding:24px;text-align:center;margin-top:20px}.word{font-size:clamp(48px,10vw,72px);font-weight:bold;letter-spacing:5px;margin:27px 0 10px;line-height:1.3;overflow-wrap:anywhere}.picture{font-size:68px;min-height:90px;line-height:90px}.picture[hidden]{display:block!important;visibility:hidden}.help{background:#fff5e8;border-radius:18px;padding:18px;margin:0 0 16px;line-height:1.5}.help p{margin:0 0 12px}.hint-word{font-size:32px;letter-spacing:5px;font-weight:bold;margin-bottom:12px}.vowel{color:#aa431c;text-decoration:underline;text-underline-offset:6px}.help-toggle{background:#fff0df;color:#8d431e}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.actions button{flex:1 1 190px}.secondary{margin-top:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.secondary button{font-size:14px;background:transparent;min-height:44px;padding:10px}.status{min-height:48px;font-size:15px;line-height:1.5;padding:8px 0;color:#46675f}.next{margin-top:18px;width:100%}.foot{text-align:center;color:#52736b;margin:16px 0 0;font-size:13px;line-height:1.5}.finish{padding:42px 12px}.finish h2{font-size:30px;margin:16px 0}.finish p{line-height:1.6;color:#52736b}.finish .actions{margin-top:25px}[hidden]{display:none!important}@media(max-width:420px){main{padding:20px 16px}.top{font-size:15px}.shelf{font-size:12px;padding:10px}h1{font-size:28px}.card{padding:20px 15px}.word{letter-spacing:3px}.actions button{flex-basis:100%}}
.vowel{color:#c62828;text-decoration:none}.consonant{color:#1565c0}.sign{color:#52736b}
.hint-word .vowel{text-decoration:underline;text-underline-offset:6px}
@font-face{font-family:ReadingHand;src:url('./fonts/MarckScript-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
.word.handwriting,.hint-word.handwriting{font-family:ReadingHand,cursive;font-weight:400;letter-spacing:0;line-height:1.5}
.letter-style{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:14px}
.letter-style select{min-width:0;flex:1;max-width:260px;min-height:48px;border:1px solid #bdd4c9;border-radius:12px;background:#fff;color:#173b35;padding:10px;font:16px Arial}
.letter-style select:focus-visible{outline:3px solid #b85e27;outline-offset:3px}
.picture{margin-bottom:48px}
/* Phone layout: keep reading and touch controls together, with room for text zoom. */
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media(max-width:600px){
 main{padding:16px max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
 .top{gap:8px;font-size:14px}.top>span{min-width:0}.shelf{font-size:12px;padding:9px 10px;flex-shrink:0;border-radius:12px}
 h1{font-size:26px;margin:22px 0 7px}.intro{font-size:14px;line-height:1.4;margin-bottom:15px}
 .levels{gap:8px}.levels>span{font-size:14px;margin-right:auto}.level{min-width:48px;min-height:48px}
 .progress-head{margin-top:18px;gap:8px;font-size:12px}.progress{gap:6px}
 .card{margin-top:14px;padding:18px 14px;border-radius:22px}
 .word{font-size:clamp(40px,12vw,64px);letter-spacing:3px;margin:4px 0 8px;line-height:1.2}
 .picture{font-size:48px;min-height:58px;line-height:58px;margin-bottom:40px}
 .actions{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}.actions button{width:100%;min-height:50px;padding:13px 10px}
 .secondary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
 .secondary button{background:#f4f8f5;font-size:13px;line-height:1.3;min-height:48px;padding:9px 6px}
 .status{min-height:0;padding:0;font-size:14px}.status:not(:empty){margin-top:10px;line-height:1.4}
 .next{margin-top:12px;min-height:50px;padding:12px 8px;font-size:15px}
 .foot{margin-top:12px;font-size:12px;line-height:1.4}
 .help{padding:14px 12px;margin-bottom:12px;font-size:14px}.hint-word{font-size:30px;letter-spacing:4px}.help button{width:100%;min-height:48px}
 .finish{padding:22px 0}.finish h2{font-size:26px}.finish p{font-size:15px}.finish .actions{margin-top:20px}
}
/* The word stays in the visual centre; controls remain below it. */
.card{min-height:calc(100dvh - 100px);display:flex;flex-direction:column;justify-content:center}.reading-stage{min-height:clamp(260px,52dvh,500px);display:grid;place-items:center;align-content:center}.reading-stage .word{font-size:clamp(64px,14vw,108px);margin:0;line-height:1.15}.reading-stage .picture{margin:18px 0 0}.picture[hidden]{display:none!important}.reading-stage .help{margin-top:24px}@media(max-width:600px){.card{min-height:calc(100dvh - 78px);padding:18px 14px}.reading-stage{min-height:clamp(300px,54dvh,480px)}.reading-stage .word{font-size:clamp(64px,19vw,96px);letter-spacing:4px}.reading-stage .picture{margin-top:16px}.reading-stage .help{margin-top:18px}}@media(max-width:350px){.top{font-size:13px}.shelf{font-size:11px;padding:8px}.levels{gap:6px}.levels>span{font-size:13px}.level{min-width:44px;padding:10px}.progress-head{font-size:11px}}
.mode-switch{display:flex;gap:8px;margin-top:14px}.mode-switch button{flex:1}.mode-switch button[aria-pressed=true]{background:#277c6b;color:#fff}.sound-card{min-height:calc(100dvh - 135px);display:flex;flex-direction:column;justify-content:center;text-align:center}.sound-stage{min-height:clamp(250px,48dvh,420px);display:grid;place-items:center;align-content:center}.sound-letter{font-size:clamp(100px,28vw,180px);font-weight:700;line-height:1;background:transparent;color:inherit;padding:0;min-height:0}.sound-picture{font-size:64px;line-height:1.2;margin-top:12px}.sound-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.sound-choice{font-size:clamp(42px,12vw,72px);min-height:90px;background:#f4f8f5}.sound-listen{margin-top:22px}.sound-note{min-height:28px;margin-top:14px;color:#52736b;font-size:14px}@media(max-width:420px){.sound-choice{min-height:82px}.sound-card{min-height:calc(100dvh - 115px)}}
</style></head><body><main>
<header class="top"><select id="language" aria-label="Язык"><option value="ru">Русский</option><option value="en">English</option><option value="fr">Français</option></select><button id="parentOpen" class="parent-link">Для родителей</button><div hidden><span id="count"></span><span id="position"></span><span id="progressText"></span><div class="progress"><span class="step"></span><span class="step"></span><span class="step"></span><span class="step"></span><span class="step"></span></div></div></header><nav class="mode-switch" aria-label="Раздел"><button id="readingMode" aria-pressed="true">Читаем</button><button id="soundsMode" aria-pressed="false">Звуки</button></nav>
<section class="card" aria-label="Карточка для чтения"><div id="exercise"><div class="reading-stage"><div class="word" id="word"></div><div class="picture" id="pic" hidden aria-hidden="true"></div></div><div class="actions"><button class="help-toggle" id="helpToggle">Помоги прочитать</button><button class="primary" id="next">Следующее</button></div></div></section>
<section class="card sound-card" id="soundsView" hidden aria-label="Игра со звуками"><div class="sound-stage"><button type="button" class="sound-letter" id="soundLetter" aria-label="Прослушать звук"></button><div class="sound-picture" id="soundPicture"></div><button class="sound-listen" id="soundListen" aria-label="Прослушать звук">🔊</button></div><div class="sound-actions" id="soundChoices"></div><div class="sound-note" id="soundNote" aria-live="polite"></div></section>
</main><section id="parentView" hidden><style>.word-list{display:grid;gap:10px;background:#fff;border-radius:18px;padding:16px;margin:10px 0 28px}.word-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:#f5f9f6;border-radius:14px}.word-row strong{font-size:20px;letter-spacing:.04em}.word-row span{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.word-row button{min-height:38px;padding:8px 10px;font-size:13px}.word-row button:last-child{background:#e8f1ec}.word-list p{margin:0;color:#52736b}.add-word{display:flex;gap:8px;margin:12px 0 24px}.add-word input{font:inherit;padding:12px;border:1px solid #d3e5dc;border-radius:14px;min-width:0;flex:1}@media(max-width:420px){.word-row{align-items:flex-start;flex-direction:column}.word-row span{justify-content:flex-start}.add-word{flex-direction:column}.add-word button{width:100%}}</style><main><button id="parentBack" class="primary">← К чтению</button><h1>Режим родителя</h1><p class="intro">Слова и прогресс сохраняются отдельно для выбранного языка.</p><h2>Написание слов</h2><div class="letter-style"><label for="letterStyle">Режим чтения</label><select id="letterStyle"><option value="title">Обычный: Кот</option><option value="upper">Заглавные: КОТ</option><option value="hand">Прописные: кот</option></select></div><h2>Добавить слово</h2><div class="add-word"><input id="customWord" maxlength="12" placeholder="Например, волк"><button id="addWord" class="primary">Добавить</button></div><h2>В работе</h2><div id="workList" class="word-list"></div><h2>Освоенные слова</h2><div id="knownList" class="word-list"></div><h2>Новые слова</h2><div id="newList" class="word-list"></div></main></section><script src="./app.js?v=14"></script></body></html>
