<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="SoundSteps — первые шаги в чтении по-русски."><title>SoundSteps</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=block" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f7faf8;color:#173b35;font:17px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}main{max-width:700px;margin:auto;padding:18px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left))}header{display:flex;align-items:center;justify-content:space-between;min-height:48px}.brand{font-weight:750}.quiet{background:transparent;color:#55746d}button,select,input{font:inherit}button{border:0;cursor:pointer;border-radius:16px;padding:13px 16px;min-height:50px;font-weight:700;touch-action:manipulation}.reading{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative}.stage{min-height:48dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}.word{font-size:clamp(70px,20vw,116px);font-weight:750;letter-spacing:.035em;line-height:1.2}.word.hand{font-family:"Bad Script",cursive;font-weight:400;letter-spacing:0;line-height:1.35}.word.hand span{display:inline-block}.vowel{color:#c62828}.consonant{color:#1565c0}.sign{color:#55746d}.picture{font-size:78px;line-height:1.2;margin-top:26px}.actions{display:grid;gap:10px;width:min(100%,470px);margin:0 auto}.primary{background:#277c6b;color:white}.help{background:#fff0df;color:#8d431e}.picture-btn{background:#edf5f1;color:#315f55}.read-ok{position:absolute;right:0;top:10px;width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;background:#edf5f1;color:#4d756b;font-size:24px;font-weight:700;transition:background .18s,color .18s}.read-ok.done{background:#248267;color:white;opacity:1}.read-ok:disabled:not(.done){opacity:.55}.confirmation{position:absolute;right:56px;top:15px;background:#dcefe7;color:#19705c;border-radius:999px;padding:8px 12px;font-size:14px;font-weight:750;opacity:0;transform:translateY(-3px);pointer-events:none;transition:opacity .18s,transform .18s}.confirmation.show{opacity:1;transform:translateY(0)}.reward{min-height:22px;margin-top:10px}.finish{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.star{font-size:92px;line-height:1;margin-bottom:22px}.finish h1{font-size:32px;margin:0 0 32px}.continue{width:min(100%,360px)}[hidden]{display:none!important}.panel{background:white;border-radius:22px;padding:18px;margin:18px 0}.intro,.empty{color:#617c75;line-height:1.45}.letter-style{position:relative}.style-select{width:100%;min-height:52px;border:1px solid #cadbd3;border-radius:13px;background:white;color:#173b35;padding:10px 48px 10px 14px;text-align:left;font-size:20px;font-weight:400;position:relative}.style-select:after{content:'⌄';position:absolute;right:16px;top:10px;font-size:24px}.style-select.hand-preview,.style-option.hand-preview{font-family:"Bad Script",cursive;font-weight:400}.style-select.hand-preview{font-size:24px}.style-menu{position:absolute;z-index:20;left:0;right:0;top:58px;background:white;border-radius:18px;padding:8px;box-shadow:0 12px 36px #173b3528;border:1px solid #e2ebe7}.style-option{display:flex;align-items:center;width:100%;min-height:54px;background:white;color:#173b35;border-radius:12px;padding:8px 14px;text-align:left;font-size:20px;font-weight:400}.style-option.hand-preview{font-size:24px}.style-option.selected{background:#edf5f1}.letter-style input,#level{min-height:48px;border:1px solid #cadbd3;border-radius:13px;background:white;padding:10px}.word-list{display:grid;gap:8px}.word-row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#f5f9f6;border-radius:13px;padding:10px 12px}.mastered-row{background:#edf7f2}.status{font-size:13px;background:#edf5f1;border-radius:999px;padding:5px 8px}.mastered-row .status{background:#dcefe7;color:#19705c}@media(max-width:430px){main{padding-top:10px}.reading,.finish{min-height:calc(100dvh - 70px)}.stage{min-height:49dvh}.picture{font-size:70px}.read-ok{top:4px;right:2px}.confirmation{top:9px;right:54px}.word-row{align-items:flex-start;flex-direction:column}}
</style></head><body>
<main id="childView"><header><div class="brand">SoundSteps</div><button id="parentOpen" class="quiet">Для родителей</button></header><section id="readingView" class="reading"><div id="confirmation" class="confirmation" aria-live="polite"></div><button id="readOk" class="read-ok" aria-label="Прочитал сам" title="Прочитал сам">✓</button><div class="stage"><div id="word" class="word"></div><div id="pic" class="picture" hidden role="img" aria-label="Картинка к слову"></div><div id="reward" class="reward"></div></div><div class="actions"><button id="help" class="help">🔊 Помоги прочитать</button><button id="showPicture" class="picture-btn">Показать картинку</button><button id="next" class="primary">Следующее слово</button></div></section><section id="finishView" class="finish" hidden><div class="star" aria-hidden="true">⭐</div><h1>Отлично!</h1><button id="continue" class="primary continue">Продолжить</button></section></main>
<section id="parentView" hidden><main><header><button id="parentBack" class="quiet">← К чтению</button><div class="brand">Для родителей</div></header><section class="panel"><h2>Стиль букв</h2><div id="letterStyle" class="letter-style"><button id="styleSelect" class="style-select" type="button" aria-haspopup="listbox" aria-expanded="false">абв</button><div id="styleMenu" class="style-menu" role="listbox" hidden><button class="style-option" data-style="normal">абв</button><button class="style-option" data-style="title">Абв</button><button class="style-option" data-style="upper">АБВ</button><button class="style-option hand-preview" data-style="handLower">абв</button><button class="style-option hand-preview" data-style="handTitle">Абв</button><button class="style-option hand-preview" data-style="handUpper">АБВ</button></div></div></section><section class="panel"><h2>В работе</h2><p class="intro">Всегда пять слов. После трёх самостоятельных прочтений слово освоено. Когда освоены три из пяти, самое давно освоенное слово заменяется новым.</p><div id="queue" class="word-list"></div></section><section class="panel"><h2>Освоенные слова</h2><div id="mastered" class="word-list"></div></section><section class="panel"><h2>Уровень</h2><select id="level"><option value="3">3 буквы</option><option value="4">4 буквы</option><option value="5">5 букв</option></select></section><section class="panel"><h2>Добавить слово</h2><div style="display:flex;gap:8px"><input id="customWord" maxlength="12" placeholder="Например, волк" style="flex:1;min-width:0"><button id="addWord" class="primary">Добавить</button></div></section></main></section><script src="./app.js?v=30"></script></body></html>
